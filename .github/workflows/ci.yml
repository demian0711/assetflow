name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: assetflow_ci
          POSTGRES_USER: assetflow_ci
          POSTGRES_PASSWORD: assetflow_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U assetflow_ci -d assetflow_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build AssetFlow.slnx -c Release
      - run: dotnet test AssetFlow.slnx -c Release --no-build
        env:
          ASSETFLOW_TEST_DB: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=assetflow_ci;Username=assetflow_ci;Password=assetflow_ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
