services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run node scripts/setup-env.mjs first}
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup-env.mjs first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs first}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    profiles: ["full"]
    build:
      context: ./src/AssetFlow.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Run node scripts/setup-env.mjs first}
      POSTGRES_USER: ${POSTGRES_USER:?Run node scripts/setup-env.mjs first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs first}
      Jwt__SigningKey: ${Jwt__SigningKey:-}
      DemoSeed__Enabled: ${DemoSeed__Enabled:-false}
      DemoSeed__Password: ${DemoSeed__Password:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    profiles: ["full"]
    build:
      context: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgres-data:
